name: Ingesta USGS

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  ingesta:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: pip install -r requirements-ingesta.txt

      - name: Ejecutar la ingesta
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          USGS_ANIO_INICIO: "1990"
        run: python src/ingesta.py
